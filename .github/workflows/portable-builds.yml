name: Portable builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, test, and package
        shell: cmd
        env:
          VELCAL_RELEASE_PACKAGE: '1'
        run: build-portable.bat --no-pause
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: build/portable/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          mkdir -p .tmp
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libfuse2 imagemagick desktop-file-utils xvfb
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DVELCAL_PORTABLE=ON -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build/ci --target velcal_app velcal_core_tests velcal_app_tests --parallel 2
      - name: Test
        run: xvfb-run -a ctest --test-dir build/ci --output-on-failure
      - name: Package
        run: bash tools/package_unix_portable.sh build/ci
      - name: Check Linux package startup
        run: |
          set +e
          xvfb-run -a timeout 8s build/portable/VelCal-*-Linux-x64-portable/VelCal.AppImage --appimage-extract-and-run
          result=$?
          test "$result" -eq 124
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-portable
          path: build/portable/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 40
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: |
          mkdir -p .tmp
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DVELCAL_PORTABLE=ON \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build/ci --target velcal_app velcal_core_tests velcal_app_tests --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Package
        run: bash tools/package_unix_portable.sh build/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-portable
          path: build/portable/*.zip
          if-no-files-found: error
